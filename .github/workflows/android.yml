
name: Build IDROK AI APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o "idrok-ai-apk.zip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          cd idrok-ai-apk
          npm install

      - name: Create Android project
        run: |
          cd idrok-ai-apk
          npx cap add android

      - name: Sync Android
        run: |
          cd idrok-ai-apk
          npx cap sync android

      - name: Build APK
        run: |
          cd idrok-ai-apk/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDROK-AI-APK
          path: idrok-ai-apk/android/app/build/outputs/apk/debug/app-debug.apk
          
