
name: Build IDROK AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o "idrok-ai-apk (1).zip"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: idrok-ai-apk
        run: npm install

      - name: Build Android APK
        working-directory: idrok-ai-apk
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: idrok-ai-apk
          path: idrok-ai-apk/android/app/build/outputs/apk/debug/app-debug.apk
          
